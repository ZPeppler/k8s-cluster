---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus-sidecar
spec:
  components:
    - ../../../../components/envoy/securitypolicy
    - ../../../../components/kanidm
  interval: 1h
  path: ./kubernetes/apps/observability/gatus-sidecar/app
  postBuild:
    substitute:
      APP: *app
      KANIDM_APP_ICON: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gatus.svg
      KANIDM_CLIENT_SECRET: client-secret
      KANIDM_GROUP: k8s-admin
      KANIDM_ORIGIN_HOST: *app
      KANIDM_REDIRECT_PATH: oauth2/callback
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
