apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app headlamp
spec:
  chartRef:
    kind: OCIRepository
    name: headlamp
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: headlamp-kanidm-oauth2-credentials
      valuesKey: CLIENT_SECRET
      targetPath: config.oidc.clientSecret
  values:
    fullnameOverride: headlamp
    clusterRoleBinding:
      create: false
    config:
      baseurl: "https://headlamp.${SECRET_DOMAIN}"
      watchPlugins: true
      oidc:
        clientID: *app
        issuerURL: https://idm.${SECRET_DOMAIN}/oauth2/openid/headlamp
        scopes: "openid,profile,email,groups"
        callbackURL: https://headlamp.${SECRET_DOMAIN}/oidc-callback
    podAnnotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      create: false
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
          - name: cloudnativepg
            source: https://artifacthub.io/packages/headlamp/cnpg-headlamp-plugin/cnpg-headlamp-plugin
          - name: external-secrets-operator
            source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
          - name: rook-ceph
            source: https://artifacthub.io/packages/headlamp/headlamp-rook/headlamp-rook-plugin
          - name: monitoring
            source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/monitoring
          - name: cilium
            source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/cilium
          - name: gateway
            source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/gateway
          - name: headlamp-plus
            source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/headlamp-plus
