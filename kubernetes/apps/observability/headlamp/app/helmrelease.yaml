apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app headlamp
spec:
  chartRef:
    kind: OCIRepository
    name: headlamp
  interval: 30m
  valuesFrom:
  values:
    fullnameOverride: headlamp
    initContainers:
      - # Generate kubeconfig file. Can be removed when https://github.com/kubernetes-sigs/headlamp/issues/1826 is resolved
        command:
          - /bin/sh
          - "-c"
          - |
            kubectl config set-cluster main --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            kubectl config set-credentials main --token=$(cat /tmp/sa-token/token)
            kubectl config set-context main --cluster=main --user=main
            kubectl config use-context main
        env:
          - name: KUBERNETES_SERVICE_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: KUBERNETES_SERVICE_PORT
            value: "6443"
          - name: KUBECONFIG
            value: /home/headlamp/.config/Headlamp/kubeconfigs/config
        image: docker.io/rancher/shell:v7.0.0
        name: create-kubeconfig
        securityContext:
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 100
        volumeMounts:
          - mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
            name: kubeconfig
          - mountPath: /tmp/sa-token
            name: sa-token
            readOnly: true
    clusterRoleBinding:
      create: false
    config:
      baseurl: "https://headlamp.${SECRET_DOMAIN}"
      watchPlugins: true
    podAnnotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      create: false
      name: headlamp-admin
    volumes:
      - name: kubeconfig
        emptyDir: {}
      - name: sa-token
        secret:
          defaultMode: 420
          secretName: headlamp-admin
    volumeMounts:
      - mountPath: /home/headlamp/.config/Headlamp/kubeconfigs/config
        name: kubeconfig
        readOnly: true
        subPath: config
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
          - name: cloudnativepg
            source: https://artifacthub.io/packages/headlamp/cnpg-headlamp-plugin/cnpg-headlamp-plugin
          - name: external-secrets-operator
            source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
          - name: rook-ceph
            source: https://artifacthub.io/packages/headlamp/headlamp-rook/headlamp-rook-plugin
          - name: monitoring
            source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/monitoring
          - name: cilium
            source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/cilium
