---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  hostnames:
    - headlamp.fade-lab.com
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: headlamp
          namespace: observability
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
