apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-driver
spec:
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-drivers
  interval: 1h
  values:
    operatorConfig:
      namespace: rook-ceph # namespace:operator
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com # csi-provisioner-name
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com # csi-provisioner-name
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com # csi-provisioner-name
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com # csi-provisioner-name
