---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.2.7
      url: oci://ghcr.io/home-operations/charts/echo
  interval: 1h
  values:
    replicaCount: 2
    config:
      kubernetes: true
      trustedProxies:
        - "10.42.0.0/16"
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.fade-lab.com"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
