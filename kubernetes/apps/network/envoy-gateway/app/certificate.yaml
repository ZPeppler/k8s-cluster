---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "fade-lab-com-production"
spec:
  dnsNames:
    - "fade-lab.com"
    - "*.fade-lab.com"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "fade-lab-com-production-tls"
  usages:
    - digital signature
