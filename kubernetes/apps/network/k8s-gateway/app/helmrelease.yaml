---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 4.0.1
      url: oci://codeberg.org/k8s-gateway/charts/k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "fade-lab.com"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.1.252"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service"]
