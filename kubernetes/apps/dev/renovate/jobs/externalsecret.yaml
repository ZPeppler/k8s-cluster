---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name github-bot-pem
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        PRIVATE_KEY: "{{ .PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: renovate
---
# yaml-language-server: $schema=https://crd.movishell.pl/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-bot-auth-token
spec:
  appID: "5240541"
  installID: "169330216"
  auth:
    privateKey:
      secretRef:
        name: github-bot-pem # reference secret from step 1.
        key: PRIVATE_KEY
---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-bot-token
spec:
  refreshInterval: "30m0s"
  target:
    name: renovate-bot-token
    template:
      type: Opaque
      engineVersion: v2
      data:
        GITHUB_COM_TOKEN: "{{ .token }}"
        GITHUB_COM_USER: "ZPeppler"
        RENOVATE_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-bot-auth-token
