---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 30m
  values:
    auth:
      oidc:
        enabled: true
        issuerUrl: "https://idm.${SECRET_DOMAIN}/oauth2/openid/renovate-operator"
        clientId: *app
        existingSecret: renovate-operator-kanidm-oauth2-credentials
        secretKey: secret
        redirectScheme: https
    authorization:
      enabled: false
    fullnameOverride: renovate-operator
    route:
      enabled: true
      hostnames:
        - renovate.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-external
          namespace: network
    webhook:
      enabled: true
