apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: forgejo-runner-config
    files:
      - podspec-default.yaml=./resources/podspec-default.yaml
      - podspec-dind.yaml=./resources/podspec-dind.yaml
      - runner.yaml=./resources/runner.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomization.toolkit.fluxcd.io/substitute: disabled
