apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: forgejo-postgres-app
      valuesKey: password
      targetPath: gitea.config.database.PASSWD
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin
        username: admin
        email: info@fade-lab.com
        passwordMode: keepUpdated
      config:
        APP_NAME: "Code-forge of Fade-Lab"
        APP_SLOGAN: "Beware the grumpy code-smith"
        cache:
          ENABLED: true
          ADAPTER: redis
          HOST: redis://forgejo-dragonfly:6379/0
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
        cron.update_mirrors:
          ENABLED: true
          SCHEDULE: "@every 10m"
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgres-rw:5432
          NAME: *app
          USER: *app
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        lfs:
          PATH: /data/git/lfs
        mirror:
          ENABLED: true
          DEFAULT_INTERVAL: 10m
          MIN_INTERVAL: 10m
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          USERNAME: preferred_username
        queue:
          TYPE: redis
          CONN_STR: redis://forgejo-dragonfly:6379/2
        repository:
          DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.actions
          DISABLED_REPO_UNITS: repo.ext_wiki,repo.ext_issues
          ROOT: /data/git/repositories
        repository.pull-request:
          DEFAULT_MERGE_STYLE: squash
        repository.signing:
          FORMAT: ssh
          SIGNING_KEY: /data/signing/ed25519.pub
          SIGNING_NAME: git.fade-lab.com Forgejo
          SIGNING_EMAIL: noreply@git.fade-lab.com
          INITIAL_COMMIT: pubkey
          CRUD_ACTIONS: pubkey, parentsigned
          WIKI: never
          MERGES: pubkey
        server:
          APP_DATA_PATH: /data/gitea
          ROOT_URL: https://git.fade-lab.com
          SSH_DOMAIN: git.fade-lab.com
          SSH_PORT: &sshPort 22
          SSH_SERVER_HOST_KEYS: ssh/ssh_host_ed25519_key
          SSH_SERVER_USE_PROXY_PROTOCOL: true
        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          ENABLE_INTERNAL_SIGNIN: false
          ENABLE_PASSWORD_SIGNING_FORM: flase
          SHOW_REGISTRATION_BUTTON: false
        service.explore:
          DISABLE_CODE_PAGE: false
          DISABLE_ORGANIZATIONS_PAGE: false
          DISABLE_USERS_PAGE: false
          REQUIRE_SIGNIN_VIEW: false
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://forgejo-dragonfly:6379/1
        ui:
          DEFAULT_THEME: gruvbox-material
          THEMES: forgejo-auto, forgejo-light, forgejo-dark, gruvbox-material
        ui.meta:
          AUTHOR: zpeppler
        webhook:
          ALLOW_HOST_LIST: "*"
      oauth:
        - name: kanidm
          provider: openidConnect
          autoDiscoverUrl: https://idm.fade-lab.com/oauth2/openid/forgejo/.well-known/openid-configuration
          existingSecret: forgejo-kanidm-oauth2-credentials
          groupClaimName: groups
          adminGroup: sys-admin@idm.fade-lab.com
          scopes: profile email groups
    extraContainerVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
      - name: forgejo-themes
        mountPath: /data/gitea/public/assets/css
        readOnly: true
    extraInitVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraVolumes:
      - name: signing-key
        secret:
          secretName: forgejo-signing-key
          defaultMode: 0400
      - name: forgejo-themes
        configMap:
          name: forgejo-themes
    httpRoute:
      enabled: false
    image:
      rootless: true
      registry: code.forgejo.org
      repository: forgejo/forgejo
      tag: 17.0.2-rootless
    persistence:
      enabled: true
      create: false
      claimName: forgejo-pvc
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false
    service:
      ssh:
        port: *sshPort
    tcpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: ssh
        - name: envoy-external
          namespace: network
          sectionName: ssh-proxy
