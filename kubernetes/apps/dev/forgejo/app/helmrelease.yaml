apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: forgejo-admin
      valuesKey: pg_pass
      targetPath: gitea.config.database.PASSWD
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin
        username: admin
        email: info@fade-lab.com
        passwordMode: keepUpdated
      config:
        server:
          APP_DATA_PATH: /data/gitea
          ROOT_URL: https://git.${SECRET_DOMAIN}
        database:
          DB_TYPE: postgres
          HOST: postgres-rw.database.svc.cluster.local:5432
          NAME: *app
          USER: *app
        cache:
          ADAPTER: redis
          HOST: redis://forgejo-dragonfly.dev.svc.cluster.local:6379/0
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://forgejo-dragonfly.dev.svc.cluster.local:6379/1
        queue:
          TYPE: redis
          CONN_STR: redis://forgejo-dragonfly.dev.svc.cluster.local:6379/2
        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          USERNAME: preferred_username
        cron.update_mirrors:
          ENABLED: true
          SCHEDULE: "@every 10m"
        mirror:
          ENABLED: true
          DEFAULT_INTERVAL: 10m
          MIN_INTERVAL: 10m
      oauth:
        - name: kanidm
          provider: openidConnect
          autoDiscoverUrl: https://idm.${SECRET_DOMAIN}/oauth2/openid/forgejo/.well-known/openid-configuration
          existingSecret: forgejo-kanidm-oauth2-credentials
          groupClaimName: groups
          adminGroup: sys-admin@idm.${SECRET_DOMAIN}
          scopes: profile email groups
    httpRoute:
      enabled: false
    image:
      rootless: true
      registry: code.forgejo.org
      repository: forgejo/forgejo
      tag: 16.0.6-rootless
    persistence:
      enabled: true
      create: false
      claimName: forgejo-pvc
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false
