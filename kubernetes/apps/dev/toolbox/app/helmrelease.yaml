apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app toolbox
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  # valuesFrom:
  #   - kind: ConfigMap
  #     name: toolbox-version
  #     valuesKey: tag
  #     targetPath: controllers.toolbox.containers.app.image.tag
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      toolblox:
        annotations:
          reloader.stakater.com/auto: "true"
        enabled: true
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: registry.fade-lab.com/zpepp-toolbox
              tag: latest@sha256:c29b7e1c281c66794c1be63a2691fc66d24bf73ca608bf5c17e76a322a32192d
            command: ["sleep", "infinity"]
            env:
              HOME: /home/toolbox
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["sh", "-c", "command -v kubectl"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
    rbac:
      roles:
        toolbox:
          forceRename: *app
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: &manageVerbs ["get", "create", "patch", "update"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: *manageVerbs
      bindings:
        toolbox:
          forceRename: *app
          type: RoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app
        toolbox-view:
          forceRename: toolbox-view
          type: ClusterRoleBinding
          roleRef:
            kind: ClusterRole
            name: view
          subjects:
            - identifier: *app
    persistence:
      tpmfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      home:
        type: emptyDir
        globalMounts:
          - path: /home/toolbox
