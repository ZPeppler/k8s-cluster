apiVersion: v1
kind: ServiceAccount
metadata:
  name: astro-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astro-builder
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configMaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astro-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astro-builder
subjects:
  - kind: ServiceAccount
    name: astro-builder
