apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: astro
spec:
  hostnames:
    - docs.fade-lab.com
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: astro-anubis
          port: 8080
      filters:
        - cors:
            allowOrigins:
              - "*"
            allowHeaders:
              - "*"
            allowMethods:
              - "*"
            maxAge: 86400
          type: CORS
      timeouts:
        request: 300s
