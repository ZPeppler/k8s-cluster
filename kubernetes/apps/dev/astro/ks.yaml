---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app astro
  namespace: &namespace dev
spec:
  components:
    - ../../../../components/anubis
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/dev/astro/app
  postBuild:
    substitute:
      APP: *app
      ANUBIS_TARGET: "http://astro.dev.svc:8080"
      NAMESPACE: *namespace
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
