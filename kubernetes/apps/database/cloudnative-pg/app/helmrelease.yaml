# yaml-language-server: $schema=https://crd.cloudjur.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  interval: 30m
  values:
    config:
      clusterWide: true
    crds:
      create: true
    monitoring:
      podMonitorEnabled: false
    resources:
      requests:
        cpu: 25m
      limits:
        memory: 384Mi
