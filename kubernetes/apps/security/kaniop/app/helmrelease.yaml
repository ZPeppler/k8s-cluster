apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaniop
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: "0.25.2"
      url: oci://ghcr.io/pando85/helm-charts/kaniop
  interval: 30m
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    webhook:
      enabled: true
    metrics:
      enabled: true
      serviceMintor:
        enabled: true
      dashboards:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
