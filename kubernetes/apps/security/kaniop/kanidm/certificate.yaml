# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "idm-${SECRET_DOMAIN/./-}"
spec:
  dnsNames:
    - "idm.${SECRET_DOMAIN}"
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 360h
  secretName: "idm-${SECRET_DOMAIN/./-}-tls"
  usages:
    - digital signature
    - key encipherment
