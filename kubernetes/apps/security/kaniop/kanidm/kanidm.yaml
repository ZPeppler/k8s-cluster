# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kaniop.rs/kanidm_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  domain: idm.${SECRET_DOMAIN}
  groupNamespaceSelector: {}
  oauth2ClientNamespaceSelector: {}
  personNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  image: docker.io/kanidm/server:1.11.2@sha256:e45f00bd354c1fc1c06a4be484b4e87b094c431e78280f1d19e911815e63efb5
  logLevel: info
  initContainers:
    - name: kanidm-reindex
      image: docker.io/kanidm/server:1.11.2@sha256:e45f00bd354c1fc1c06a4be484b4e87b094c431e78280f1d19e911815e63efb5
      command:
        - kanidmd
        - database
        - reindex
      env:
        - name: KANIDM_DOMAIN
          value: idm.${SECRET_DOMAIN}
        - name: KANIDM_ORIGIN
          value: https://idm.${SECRET_DOMAIN}
        - name: KANIDM_DB_PATH
          value: /data/kanidm.db
        - name: KANIDM_TLS_CHAIN
          value: /etc/kanidm/tls/tls.crt
        - name: KANIDM_TLS_KEY
          value: /etc/kanidm/tls/tls.key
      volumeMounts:
        - name: kanidm-data
          mountPath: /data
        - name: kanidm-certs
          mountPath: /etc/kanidm/tls
          readOnly: true
  replicaGroups:
    - name: default
      primaryNode: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      statefulSetAnnotations:
        reloader.stakater.com/auto: "true"
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ceph-block
  tlsSecretName: idm-${SECRET_DOMAIN/./-}-tls
  gateway:
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-external
        namespace: network
        sectionName: https
    hostnames:
      - idm.${SECRET_DOMAIN}
    backendTlsPolicy:
      validation:
        hostname: idm.${SECRET_DOMAIN}
        wellKnownCaCertificates: System
