# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kaniop.rs/kanidm_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  domain: idm.fade-lab.com
  groupNamespaceSelector: {}
  oauth2ClientNamespaceSelector: {}
  personNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  image: docker.io/kanidm/server:1.12.1@sha256:77198131f28116203e105d2e42214203757d113a694f35de545669e75db5c96f
  logLevel: info
  initContainers:
    - name: kanidm-reindex
      image: docker.io/kanidm/server:1.12.1@sha256:77198131f28116203e105d2e42214203757d113a694f35de545669e75db5c96f
      command:
        - kanidmd
        - database
        - reindex
      env:
        - name: TZ
          value: America/New_York
        - name: KANIDM_DOMAIN
          value: idm.fade-lab.com
        - name: KANIDM_ORIGIN
          value: https://idm.fade-lab.com
        - name: KANIDM_DB_PATH
          value: /data/kanidm.db
        - name: KANIDM_TLS_CHAIN
          value: /etc/kanidm/tls/tls.crt
        - name: KANIDM_TLS_KEY
          value: /etc/kanidm/tls/tls.key
      volumeMounts:
        - name: kanidm-data
          mountPath: /data
        - name: kanidm-certs
          mountPath: /etc/kanidm/tls
          readOnly: true
  replicaGroups:
    - name: default
      primaryNode: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      statefulSetAnnotations:
        reloader.stakater.com/auto: "true"
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ceph-block
  tlsSecretName: idm-fade-lab-com-tls
  gateway:
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-external
        namespace: network
        sectionName: https
    hostnames:
      - idm.fade-lab.com
    backendTlsPolicy:
      validation:
        hostname: idm.fade-lab.com
        wellKnownCaCertificates: System
  volumes:
    - name: custom-css
      configMap:
        name: kanidm-theme
  volumeMounts:
    - name: custom-css
      mountPath: /hpkg/override.css
      subPath: override.css
