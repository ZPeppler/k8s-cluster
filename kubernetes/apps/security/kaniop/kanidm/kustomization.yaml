# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./certificate.yaml
  - ./groups.yaml
  - ./kanidm.yaml
  - ./persons.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: kanidm-theme
    files:
      - override.css=./resources/themes/gruvbox-kanidm.css
generatorOptions:
  disableNameSuffixHash: true
