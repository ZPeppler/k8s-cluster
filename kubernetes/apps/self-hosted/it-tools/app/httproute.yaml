apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app searxng
spec:
  hostnames:
    - tools.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: *app
          namespace: self-hosted
          port: 8080
