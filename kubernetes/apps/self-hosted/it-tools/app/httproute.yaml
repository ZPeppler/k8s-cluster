apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app it-tools
spec:
  hostnames:
    - tools.fade-lab.com
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: *app
          namespace: self-hosted
          port: 8080
