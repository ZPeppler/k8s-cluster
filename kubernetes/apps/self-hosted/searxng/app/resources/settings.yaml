---
use_default_settings: true

server:
  method: GET
  public_instance: false

search:
  autocomplete: duckduckgo
  favicon_resolver: duckduckgo
  languages:
    - all
    - en
    - en-US
  formats:
    - html
    - json

general:
  instance_name: Fade Lab Search

ui:
  default_theme: simple
  infinite_scroll: true
  query_in_title: true
  results_on_new_tab: true
  static_use_hash: true
  theme_args:
    simple_style: auto

enabled_plugins:
  - Basic Calculator
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin
