apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apoci
spec:
  hostnames:
    - registry.fade-lab.com
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: apoci
          namespace: self-hosted
          port: 5000
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: registry.fade-lab.com
      matches:
        - path:
            type: Exact
            value: /.well-known/webfinger
          queryParams:
            - name: resource
              type: RegularExpression
              value: ".*registry@.*"
