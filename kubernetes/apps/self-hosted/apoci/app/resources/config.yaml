---
endpoint: "https://registry.fade-lab.com"
accountDomain: "fade-lab.com"
listen: ":5000"
dataDir: "/data"
logFormat: json

database:
  driver: postgres

peering:
  healthCheckInterval: 30s
  fetchTimeout: 60s

limits:
  maxBlobSize: 5368709120 # 5 GiB

gc:
  untaggedManifestAge: 1h
  orphanBatchSize: 10000
  interval: 30m
  diskUsageThreshold: 80
  diskUsageCheckInterval: 5m
  retention:
    maxAge: 168h
    pinnedGlobs:
      - "v*"
      - "*.*.*"
    perRepo:
      - repo: "registry.fade-lab.com/k8s-cluster"
        keepLastN: 7
      - repo: "registry.fade-lab.com/lab-docs"
        keepLastN: 7
      - repo: "registry.fade-lab.com/toolbox"
        keepLastN: 7

metrics:
  enabled: true
  listen: ":9090"

federation:
  autoAccept: mutual
  excludedRepos:
    - "*/*-buildcache"

upstreams:
  enabled: true
  registries:
    - name: docker.io
      endpoint: "https://registry-1.docker.io"
    - name: ghcr.io
      endpoint: "https://ghcr.io"

ui:
  enabled: true
