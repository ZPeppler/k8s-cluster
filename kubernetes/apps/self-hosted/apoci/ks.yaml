---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app apoci
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/cnpg/pg18
    - ../../../../components/storage
  interval: 1h
  path: ./kubernetes/apps/self-hosted/apoci/app
  postBuild:
    substitute:
      APP: *app
      APP_REQUEST: 50Gi
      CNPG_INSTANCES: "3"
      CNPG_MEMORY_LIMIT: 2Gi
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
  timeout: 5m
  wait: false
