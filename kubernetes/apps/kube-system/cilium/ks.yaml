---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cilium
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/envoy/securitypolicy
    - ../../../../components/kanidm
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium/app
  postBuild:
    substitute:
      APP: hubble
      KANIDM_APP_ICON: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/cilium.svg
      KANIDM_CLIENT_SECRET: client-secret
      KANIDM_GROUP: k8s-admin
      KANIDM_ORIGIN_HOST: hubble
      KANIDM_REDIRECT_PATH: oauth2/callback
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
