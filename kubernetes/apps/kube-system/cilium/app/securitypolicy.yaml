apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-oidc
  namespace: kube-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble
  oidc:
    provider:
      issuer: https://idm.${SECRET_DOMAIN}/oauth2/openid/hubble
    clientID: hubble
    clientSecret:
      name: hubble-oidc-client-secret
    redirectURL: https://hubble.${SECRET_DOMAIN}/oauth2/callback
    logoutPath: /logout
