---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.6.6
      url: oci://ghcr.io/home-operations/charts/konflate
  interval: 1h
  values:
    config:
      repo: forgejo://git.fade-lab.com/zpeppler/k8s-cluster
      refreshInterval: 5m
      publicUrl: https://konflate.fade-lab.com
      mcp: true
      prComments: true
      statusChecks: true
    secret:
      existingSecret: konflate
    httpRoute:
      enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 1434Mi
      limits:
        cpu: "2"
        memory: 2Gi
