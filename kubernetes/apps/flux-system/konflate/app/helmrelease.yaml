---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://zpeppler/k8s-cluster
      publicUrl: https://konflate.fade-lab.com
      mcp: true
      prComments: true
      statusChecks: true
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 1434Mi
      limits:
        cpu: "2"
        memory: 2Gi
