---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: forgejo://git.fade-lab.com/zpeppler/k8s-cluster
      publicUrl: https://konflate.fade-lab.com
      mcp: true
      prComments: true
      statusChecks: true
    secret:
      existingSecret: konflate
    httpRoute:
      enabled: true
      hostnames:
        - konflate.fade-lab.com
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 1434Mi
      limits:
        cpu: "2"
        memory: 2Gi
