---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign-public-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        cosign.pub: "{{ .COSIGN_PUBLIC_KEY }}"
  dataFrom:
    - extract:
        key: flux
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-webhook-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-webhook-token
    template:
      data:
        token: "{{ .WEBHOOK_TOKEN }}"
  dataFrom:
    - extract:
        key: flux
