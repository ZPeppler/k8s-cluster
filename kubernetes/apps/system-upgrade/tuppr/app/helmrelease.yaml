apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.5.14
      url: oci://ghcr.io/home-operations/charts/tuppr
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: false
        grafanaOperator:
          enabled: false
          matchLabels:
            dashboards: grafana
