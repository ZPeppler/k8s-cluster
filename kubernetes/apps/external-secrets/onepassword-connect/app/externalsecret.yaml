apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: onepassword-secret
    template:
      data:
        1password-credentials.json: "{{ .JSON_CREDENTIALS }}"
        token: "{{ .TOKEN }}"
  dataFrom:
    - extract:
        key: 1password
