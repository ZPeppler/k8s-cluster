apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 2.15.0
      url: oci://ghcr.io/external-secrets/charts/external-secrets
  interval: 30m
  values:
    image:
      repository: ghcr.io/external-secrets/external-secrets
    installCRDs: true
    serviceMonitor:
      enabled: true
      interval: 1m
    certController:
      image:
        repository: ghcr.io/external-secrets/external-secrets
      serviceMonitor:
        enabled: true
        interval: 1m
    webhook:
      image:
        repository: ghcr.io/external-secrets/external-secrets
      replicaCount: 2
      serviceMonitor:
        enabled: true
        interval: 1m
    grafanaDashboard:
      enabled: true
