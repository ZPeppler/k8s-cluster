# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}-anubis
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      anubis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.28.2
            env:
              BIND: ":8080"
              DIFFICULTY: '${ANUBIS_DIFFICULTY:="4"}'
              ED25519_PRIVATE_KEY_HEX:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-anubis-key
                    key: ED25519_PRIVATE_KEY_HEX
              METRICS_BIND: ":9090"
              OG_EXPIRY_TIME: "24h"
              OG_PASSTHROUGH: "true"
              POLICY_FNAME: "/etc/anubis/policy.yaml"
              SERVE_ROBOTS_TXT: "true"
              TARGET: "${ANUBIS_TARGET}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "anubis"
                      - "--healthcheck"
                  initialDelaySeconds: 1
                  periodSeconds: 10
              readiness: *probes
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
    configMaps:
      policy:
        suffix: policy
        data:
          policy.yaml: |-
            bots:
              - import: (data)/apps/gitea-rss-feeds.yaml
              - import: (data)/clients/git.yaml
              - import: (data)/clients/docker-client.yaml
              - name: allow-api
                path_regex: ^/api/.*
                action: ALLOW
              - name: allow-git-clients
                user_agent_regex: ^git/
                path_regex: ^/.+\.git/(info/refs|git-upload-pack|git-receive-pack)$
                action: ALLOW
              # ActivityPub federation: inbound from other instances + browser-origin AP fetches.
              # Inert for non-federated apps (no client sends these paths/headers).
              - name: allow-activitypub
                action: ALLOW
                expression:
                  any:
                    - path.startsWith("/.well-known/")
                    - path.startsWith("/nodeinfo/")
                    - path == "/inbox"
                    - path == "/site_inbox"
                    - path == "/actor"
                    - path.endsWith("/inbox")
                    - path.endsWith("/outbox")
                    - '"Accept" in headers && (headers["Accept"].contains("application/activity+json") || headers["Accept"].contains("application/ld+json"))'
                    - '"Content-Type" in headers && headers["Content-Type"].contains("application/activity+json")'
              - import: (data)/meta/default-config.yaml
            store:
              backend: valkey
              parameters:
                url: "redis://anubis-dragonfly.security.svc:6379/3"
    service:
      anubis:
        primary: true
        controller: anubis
        ports:
          http:
            port: 8080
            protocol: HTTP
          metrics:
            port: 9090
            protocol: HTTP
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 30s
    persistence:
      policy:
        type: configMap
        identifier: policy
        globalMounts:
          - path: /etc/anubis
            readOnly: true
