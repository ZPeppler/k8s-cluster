---
name: Push OCI Artifact

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/**
  workflow_dispatch:

concurrency:
  group: oci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OCI_REPO: oci://registry.fade-lab.com/k8s-cluster
      OCI_USER: registry
      OCI_PASS: ${{ secrets.APOCI_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a

      - name: Push OCI Artifact
        id: push
        run: |
          DIGEST_URL=$(flux push artifact \
            ${OCI_REPO}:${{ github.sha }} \
            --path=. \
            --source=${{ github.server_url }}/${{ github.repository }} \
            --revision=${GITHUB_REF_NAME}@sha1:${{ github.sha }} \
            --creds=${OCI_USER}:${OCI_PASS} \
            --output json | \
            jq -r '.repository + "@" + .digest')
          echo "digest-url=$DIGEST_URL" >> "$GITHUB_OUTPUT"

      - name: Tag mutable ref
        if: github.ref == 'refs/heads/main'
        run: |
          flux tag artifact ${OCI_REPO}:${{ github.sha }} --tag main \
            --creds=${OCI_USER}:${OCI_PASS}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Sign OCI artifact
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          STEPS_PUSH_OUTPUTS_DIGEST_URL: ${{ steps.push.outputs.digest-url }}
        run: |-
          cosign sign --yes \
            --key env://COSIGN_KEY \
            --registry-username=${OCI_USER} \
            --registry-password=${OCI_PASS} \
            ${STEPS_PUSH_OUTPUTS_DIGEST_URL}

  reconcile:
    runs-on: ubuntu-latest
    needs: push-sign
    permissions:
      contents: read
    steps:
      - name: Trigger FluxCD reconciliation
        env:
          WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
          WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |-
          SIGNATURE=$(printf '{}' | openssl dgst -sha256 -r -hmac "${WEBHOOK_TOKEN}" | awk '{print $1}')
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${WEBHOOK_URL}" -H 'Content-Type: application/json' -H "X-Signature: sha256=${SIGNATURE}" -d '{}')
          echo "Flux webhook response: HTTP ${HTTP_STATUS}"
          test "${HTTP_STATUS}" = "200"
